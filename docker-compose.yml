services:
  postgres:
    image: postgres:16
    container_name: ptcg_postgres
    env_file:
      - .env
    # Keep PostgreSQL private to the internal Docker network in the base config.
    # Local host access for Nuxt/Prisma development is defined in docker-compose.dev.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod

  pgadmin:
    image: dpage/pgadmin4
    container_name: ptcg_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_KEY: ${SUPABASE_KEY}
    container_name: ptcg_app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NODE_ENV=production
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_WEBHOOK_SECRET=${SUPABASE_WEBHOOK_SECRET}
      # Nuxt runtime config overrides (no rebuild needed)
      - NUXT_SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NUXT_SUPABASE_WEBHOOK_SECRET=${SUPABASE_WEBHOOK_SECRET}
    ports:
      - "8080:3000"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - prod

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
